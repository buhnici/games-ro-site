<style>
/* ==== SURSA: site-new/tokens.css — nu edita aici ==== */
:root {
  --bg-deep: #05060f;
  --bg-mid: #0b0d1f;
  --bg-panel: rgba(10, 14, 28, 0.92);
  --bg-panel-solid: #0a0e1c;
  --bg-cabinet: rgba(8, 11, 24, 0.96);
  --neon-cyan: #00e5ff;
  --neon-magenta: #ff2e88;
  --amber: #ffb300;
  --live: #39ff88;
  --text: #f2f4ff;
  --text-dim: #9aa3c0;
  --text-faint: #5a6284;
  --font-display: "Avenir Next Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --tracking-display: 0.14em;
  --tracking-label: 0.22em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 40px;
  --space-6: 64px;
  --radius-panel: 14px;
  --radius-cabinet: 10px;
  --radius-btn: 6px;
  --border-neon: 1px solid rgba(0, 229, 255, 0.55);
  --border-neon-strong: 2px solid var(--neon-cyan);
  --border-magenta: 1px solid rgba(255, 46, 136, 0.5);
  --glow-cyan: 0 0 10px rgba(0, 229, 255, 0.55), 0 0 28px rgba(0, 229, 255, 0.22), inset 0 0 12px rgba(0, 229, 255, 0.08);
  --glow-magenta: 0 0 10px rgba(255, 46, 136, 0.5), 0 0 24px rgba(255, 46, 136, 0.2);
  --glow-amber: 0 0 12px rgba(255, 179, 0, 0.6), 0 0 30px rgba(255, 179, 0, 0.25);
  --text-glow-cyan: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 229, 255, 0.5);
  --text-glow-magenta: 0 0 10px var(--neon-magenta);
  --chromatic: -2px 0 var(--neon-cyan), 2px 0 var(--neon-magenta);
  --ease-arcade: cubic-bezier(0.2, 0.9, 0.3, 1.2);
  --speed-hover: 150ms;
  --speed-pulse: 3.5s;
  --speed-marquee: 4s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-body);
  color:var(--text);
  background:linear-gradient(180deg,var(--bg-deep) 0%,var(--bg-mid) 100%);
  min-height:100vh;
  overflow-x:hidden;
}
.console{max-width:1200px;margin:0 auto;padding:var(--space-4) var(--space-3) var(--space-5)}

/* Header */
.console-header{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);
  border:var(--border-neon-strong);border-radius:var(--radius-panel);
  background:linear-gradient(135deg,rgba(0,229,255,0.10) 0%,var(--bg-panel-solid) 100%);
}
.logo-glow{
  font-family:var(--font-mono);font-weight:700;font-size:1.3rem;
  letter-spacing:var(--tracking-display);color:var(--text);
  text-shadow:var(--chromatic),var(--text-glow-cyan);
  text-decoration:none;
}
.logo-glow span{color:var(--neon-magenta);text-shadow:var(--text-glow-magenta)}
.player-status{display:flex;gap:var(--space-4);font-family:var(--font-mono);font-size:0.85rem}
.status-label{color:var(--text-dim);text-transform:uppercase;letter-spacing:var(--tracking-label);font-size:0.7rem}
.status-value{color:var(--text);font-weight:700}
.status-value.hot{color:var(--neon-magenta);text-shadow:var(--text-glow-magenta)}
.clock{text-align:right;font-family:var(--font-mono)}
.clock-time{font-size:1rem;color:var(--neon-cyan)}
.clock-date{font-size:0.7rem;color:var(--text-dim)}

/* Game */
.game-title{
  font-family:var(--font-display);font-size:1.8rem;letter-spacing:var(--tracking-display);
  text-transform:uppercase;color:var(--text);
  text-shadow:var(--chromatic),var(--text-glow-cyan);
  text-align:center;margin:var(--space-4) 0 var(--space-3);
}
.game-instructions{
  font-size:0.85rem;color:var(--text-dim);text-align:center;margin-bottom:var(--space-4);
}
.products-list{
  display:grid;gap:var(--space-3);
  max-width:800px;margin:0 auto var(--space-5);
}
.product-card{
  background:var(--bg-cabinet);border:var(--border-neon);border-radius:var(--radius-panel);
  padding:var(--space-3);transition:transform var(--speed-hover) var(--ease-arcade);
  display:flex;align-items:center;gap:var(--space-3);
  position:relative;
}
.product-card:hover{transform:scale(1.02)}
.product-image{
  width:80px;height:80px;object-fit:contain;
  border-radius:var(--radius-btn);
  background:var(--bg-panel-solid);
}
.product-info{flex:1}
.product-name{
  font-family:var(--font-mono);font-size:0.85rem;color:var(--text);
  line-height:1.3;margin-bottom:var(--space-1);
}
.product-tip{
  font-size:0.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:var(--tracking-label);
}
.product-input-group{display:flex;align-items:center;gap:var(--space-2)}
.product-input{
  width:100px;padding:8px 12px;
  background:var(--bg-panel-solid);border:var(--border-neon);
  border-radius:var(--radius-btn);color:var(--text);
  font-family:var(--font-mono);font-size:0.9rem;
  text-align:right;
}
.product-input:focus{outline:none;border-color:var(--neon-cyan)}
.product-ron{color:var(--neon-cyan);font-weight:700}
.product-link{
  display:inline-block;margin-top:var(--space-3);
  padding:8px 16px;
  background:var(--bg-panel-solid);border:var(--border-neon);
  border-radius:var(--radius-btn);color:var(--text);
  font-size:0.8rem;text-decoration:none;
  transition:all var(--speed-hover) ease;
}
.product-link:hover{color:var(--neon-magenta);border-color:var(--neon-magenta)}
.product-reveal{display:none;margin-top:var(--space-3);padding:var(--space-3);border-radius:var(--radius-btn)}
.product-reveal.show{display:block}

/* Feedback */
.feedback-msg{color:var(--text-dim);font-size:0.85rem;text-align:center;margin:var(--space-3) 0}
.feedback-score{
  font-family:var(--font-display);font-size:1.5rem;letter-spacing:var(--tracking-display);
  text-transform:uppercase;color:var(--text);text-shadow:var(--text-glow-cyan);
  text-align:center;margin:var(--space-3) 0;
}
.feedback-score.ok{color:var(--live);text-shadow:0 0 10px rgba(57,255,136,0.5)}
.feedback-score.partial{color:var(--amber);text-shadow:0 0 10px rgba(255,179,0,0.5)}
.feedback-score.fail{color:var(--neon-magenta);text-shadow:0 0 10px rgba(255,46,136,0.5)}

/* Share */
.share-section{text-align:center;margin-top:var(--space-5)}
.share-button{
  display:inline-block;padding:12px 28px;border:1px solid var(--neon-cyan);
  background:transparent;color:var(--text);font-family:var(--font-mono);font-size:0.75rem;
  font-weight:700;letter-spacing:var(--tracking-display);text-transform:uppercase;
  border-radius:var(--radius-btn);text-decoration:none;
  transition:transform var(--speed-hover) var(--ease-arcade),box-shadow var(--speed-hover) ease,color var(--speed-hover) ease;
  cursor:pointer;
}
.share-button:hover:not(:disabled){transform:scale(1.04);border-color:var(--amber);color:var(--amber);box-shadow:var(--glow-amber)}
.share-button:disabled{color:var(--text-dim);border-color:var(--text-faint);cursor:default}

/* Pictogramele categoriilor (SVG inline, currentColor) */
.ico{display:inline-flex;flex:none;color:var(--neon-cyan)}
.ico svg{width:100%;height:100%}
.ico-mare{width:88px;height:88px;padding:22px;border:var(--border-neon);border-radius:var(--radius-cabinet);background:var(--bg-panel-solid)}
.ico-mic{width:28px;height:28px}
#pret-input:focus{outline:none}
#pret-input:focus-visible{outline:2px solid var(--neon-cyan);outline-offset:2px}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.modal-overlay.active{display:flex}
.modal-content{
  background:var(--bg-panel);border:var(--border-neon-strong);
  border-radius:var(--radius-panel);padding:var(--space-5);
  max-width:400px;width:90%;
  text-align:center;
  box-shadow:var(--glow-cyan);
}
.modal-title{
  font-family:var(--font-display);font-size:1.5rem;letter-spacing:var(--tracking-display);
  text-transform:uppercase;color:var(--text);margin-bottom:var(--space-3);
  text-shadow:var(--text-glow-cyan);
}
.modal-message{
  font-size:1rem;color:var(--text-dim);margin-bottom:var(--space-4);
}
.modal-score{
  font-family:var(--font-display);font-size:2rem;color:var(--neon-cyan);
  margin:var(--space-3) 0;
}
.modal-btn{
  display:inline-block;padding:12px 24px;border:1px solid var(--neon-cyan);
  background:var(--bg-panel);color:var(--text);font-family:var(--font-mono);font-size:0.8rem;
  font-weight:700;letter-spacing:var(--tracking-display);text-transform:uppercase;
  border-radius:var(--radius-btn);text-decoration:none;
  transition:transform var(--speed-hover) var(--ease-arcade),box-shadow var(--speed-hover) ease,color var(--speed-hover) ease;
  cursor:pointer;
}
.modal-btn:hover{transform:scale(1.04);border-color:var(--amber);color:var(--amber);box-shadow:var(--glow-amber)}

/* Scanlines */
.scanlines::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0.05) 0 1px,transparent 1px 3px);
  opacity:0.55;z-index:9998;
}
.crt-vignette::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,0.55) 100%);
  z-index:9999;
}

/* Responsive */
@media (prefers-reduced-motion: reduce) {
  .product-card, .share-button, .modal-btn { transition: none !important; }
}

/* Mobile */
@media (max-width:480px) {
  .game-title{font-size:1.4rem}
  .product-card{flex-direction:column;text-align:center}
  .product-image{width:60px;height:60px}
  .product-info{width:100%}
  .product-input-group{justify-content:center;margin-top:var(--space-2)}
}
</style>

  <a href="/" class="logo-glow">GAMES<span>.ro</span></a>
  <div class="player-status"><div class="status-item"><span class="status-label">STREAK</span> <span class="status-value" id="streak">0</span></div>
    <div class="clock">
      <div class="clock-time" id="clock-time">--:--</div>

<h1 class="game-title">Prețul Corect</h1>
<p class="game-instructions">Ghicește 5 prețuri reale din România, de la biletul de metrou la litrul de lapte. Scor maxim 500.</p>

<div class="products-list" id="products-list"></div>

<div id="feedback-area" style="display:none;">
  <div class="feedback-msg" id="feedback-msg"></div>
  <div class="feedback-score" id="feedback-score"></div>

    <div class="modal-message" id="modal-message"></div>

    <button class="modal-btn" id="modal-close">ÎNCHIDE</button>
  </div>
</div>
</div>

<script type="module">
// ==== PREȚUL CORECT — logica jocului (rescriere manager v2, 17.09.2026) ====
import { GamesRO } from "/shell.js";
import { PRODUSE, produseleZilei, scor } from "./pretul-corect.js?v=29";

const SLUG = "pretul-corect";
const ZI = GamesRO.seedAzi();
// :v2 = prețurile de zi cu zi (23.09.2026); starea salvată pe produsele gb.ro nu se mai potrivește
const STATE_KEY = "gro:" + SLUG + ":stare:" + ZI + ":v2";
const PRAG_VICTORIE = 300;

// Pictograme per categorie — SVG inline, fără imagini externe
const SVG = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
const ICON = {
  transport: SVG('<rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 11h16M8 18v2.5M16 18v2.5"/><circle cx="8" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/>'),
  taxe: SVG('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>'),
  alimente: SVG('<path d="M3 5h2l2 11h11l2-8H6.2"/><circle cx="9" cy="19.5" r="1.2"/><circle cx="17" cy="19.5" r="1.2"/>'),
  carburant: SVG('<path d="M5 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15M3 20h14M5 10h10"/><path d="M15 8l3 3v6a1.5 1.5 0 0 0 3 0V9l-2-2"/>'),
  abonamente: SVG('<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M10 8.5v5l4.5-2.5z"/><path d="M8 21h8"/>'),
  altele: SVG('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>'),
};
const ETICHETA = { transport: "Transport", taxe: "Taxe și acte", alimente: "Coșul zilnic", carburant: "Carburant", abonamente: "Abonamente", altele: "Diverse" };

const fmtLei = (x) => x.toLocaleString("ro-RO", { minimumFractionDigits: Number.isInteger(x) ? 0 : 2, maximumFractionDigits: 2 }) + " lei";
const fmtData = (iso) => iso.split("-").reverse().join(".");
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

// „7,49", „7.49", „1.500" (mii, stil românesc), „1.500,50", „12 lei"
function citestePret(s) {
  s = s.replace(/lei|ron|\s/gi, "");
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "");
  return parseFloat(s.replace(",", "."));
}

function sursaHTML(p) {
  return '<a href="' + esc(p.sursa) + '" target="_blank" rel="noopener nofollow" style="color:var(--text-dim);font-size:0.75rem">sursa: ' +
    esc(p.sursa_nume) + " · " + fmtData(p.verificat) + "</a>";
}

const productsList = document.getElementById("products-list");
const feedbackArea = document.getElementById("feedback-area");
const feedbackMsg = document.getElementById("feedback-msg");
const feedbackScore = document.getElementById("feedback-score");
const productsReveal = document.getElementById("products-reveal");
const shareButton = document.getElementById("share-button");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modal-title");
const modalMessage = document.getElementById("modal-message");
const modalScore = document.getElementById("modal-score");
const modalClose = document.getElementById("modal-close");
const clockTimeEl = document.getElementById("clock-time");
const clockDateEl = document.getElementById("clock-date");
const streakEl = document.getElementById("streak");

const produse = produseleZilei(ZI).map((i) => PRODUSE[i]);

let runda = 0;          // 0..4 — runda curentă
let puncte = [];        // punctele per rundă
let ghiciri = [];       // estimările per rundă
let done = false, win = false;

function citesteStare() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!Array.isArray(s.puncte)) return null;
    return s;
  } catch { return null; }
}
function salveazaStare() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({ runda, puncte, ghiciri, done, win }));
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.indexOf("gro:" + SLUG + ":stare:") === 0 && k !== STATE_KEY) localStorage.removeItem(k);
    }
  } catch { /* private mode */ }
}

const total = () => puncte.reduce((a, b) => a + b, 0);

function randeazaIstoric() {
  productsReveal.innerHTML = "";
  produse.slice(0, runda).forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "reveal-row";
    row.style.cssText = "display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,229,255,0.2);flex-wrap:wrap";
    const tu = ghiciri[i] != null ? " (tu: " + fmtLei(ghiciri[i]) + ")" : "";
    row.innerHTML =
      '<span class="ico ico-mic">' + ICON[p.categorie] + "</span>" +
      '<span style="flex:1;min-width:160px;color:var(--text-dim);font-size:0.85rem;line-height:1.5">' + esc(p.nume) + "<br>" + sursaHTML(p) + "</span>" +
      '<span style="font-family:var(--font-mono);color:var(--neon-cyan)">' + fmtLei(p.pret) + tu + "</span>" +
      '<span style="font-family:var(--font-mono);color:' + (puncte[i] >= 70 ? "var(--live)" : puncte[i] >= 30 ? "var(--amber)" : "var(--neon-magenta)") + '">+' + puncte[i] + "</span>";
    productsReveal.appendChild(row);
  });
}

function randeazaRunda() {
  productsList.innerHTML = "";
  feedbackScore.textContent = total() + " / 500";
  if (done) {
    feedbackArea.style.display = "block";
    feedbackMsg.textContent = win
      ? "Ai terminat ziua cu " + total() + " din 500. Revino mâine pentru alte prețuri!"
      : "Ai terminat cu " + total() + " din 500. Pragul e " + PRAG_VICTORIE + ". Revanșa: mâine!";
    feedbackMsg.className = "feedback-msg " + (win ? "correct" : "wrong");
    randeazaIstoric();
    return;
  }
  const p = produse[runda];
  const card = document.createElement("div");
  card.className = "product-card";
  card.innerHTML =
    '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">' +
    '<span class="ico ico-mare">' + ICON[p.categorie] + "</span>" +
    '<div style="flex:1;min-width:200px">' +
    '<div class="product-name" style="color:var(--text);margin-bottom:4px;font-size:1rem">' + esc(p.nume) + "</div>" +
    '<div class="product-tip" style="color:var(--text-dim);font-size:0.75rem;text-transform:uppercase;letter-spacing:var(--tracking-label)">Runda ' + (runda + 1) + " din 5 · " + ETICHETA[p.categorie] + "</div>" +
    "</div>" +
    '<div style="display:flex;gap:8px;align-items:center">' +
    '<input type="text" inputmode="decimal" autocomplete="off" id="pret-input" placeholder="Preț în lei" aria-label="Prețul estimat, în lei" style="width:140px;padding:12px;background:var(--bg-cabinet);border:var(--border-neon);border-radius:var(--radius-btn);color:var(--text);font-family:var(--font-mono);font-size:1rem">' +
    '<button id="trimite-btn" class="share-button">TRIMITE</button>' +
    "</div></div>";
  productsList.appendChild(card);

  const input = card.querySelector("#pret-input");
  const btn = card.querySelector("#trimite-btn");
  const trimite = () => {
    const val = citestePret(input.value);
    if (!isFinite(val) || val <= 0) { input.focus(); return; }
    const pct = scor(val, p.pret);
    puncte.push(pct);
    ghiciri.push(val);
    feedbackArea.style.display = "block";
    feedbackMsg.textContent = "Prețul real: " + fmtLei(p.pret) + " (" + p.sursa_nume + ", " + fmtData(p.verificat) + "). Estimarea ta: " + fmtLei(val) + " → +" + pct + " puncte.";
    feedbackMsg.className = "feedback-msg " + (pct >= 70 ? "correct" : pct >= 30 ? "aproape" : "wrong");
    runda++;
    if (runda >= 5) {
      done = true;
      win = total() >= PRAG_VICTORIE;
      if (win) GamesRO.marcheazaJucat(SLUG, { scor: total() });
      shareButton.disabled = false;
      actualizeazaStreak();
      setTimeout(arataModal, 700);
    }
    salveazaStare();
    randeazaRunda();
    randeazaIstoric();
  };
  btn.addEventListener("click", trimite);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") trimite(); });
  input.focus();
}

function actualizeazaStreak() { streakEl.textContent = GamesRO.streak(SLUG); }

function arataModal() {
  if (win) {
    modalTitle.textContent = "Felicitări!";
    modalTitle.style.color = "var(--live)";
    modalMessage.textContent = "Scor final: " + total() + " din 500. Ai trecut pragul de " + PRAG_VICTORIE + "!";
  } else {
    modalTitle.textContent = "Aproape...";
    modalTitle.style.color = "var(--neon-magenta)";
    modalMessage.textContent = "Scor final: " + total() + " din 500. Pragul de victorie e " + PRAG_VICTORIE + ". Revino mâine!";
  }
  modalScore.textContent = total() + " / 500";
  modal.classList.add("active");
}

async function distribuie() {
  if (!done) return;
  const grila = puncte.map((p) => (p >= 70 ? "🟩" : p >= 30 ? "🟨" : "⬛")).join("");
  const out = await GamesRO.share(SLUG, grila, total() + "/500");
  if (out === "copied") feedbackShare("COPIAT!");
  else if (out === false) feedbackShare("COPIAZĂ MANUAL");
}

let shareTimer = null;
function feedbackShare(t) {
  shareButton.textContent = t;
  clearTimeout(shareTimer);
  shareTimer = setTimeout(() => { shareButton.textContent = "SHARE"; }, 1600);
}

function updateClock() {
  const now = new Date();
  clockTimeEl.textContent = now.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
  clockDateEl.textContent = now.toLocaleDateString("ro-RO", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function init() {
  const s = citesteStare();
  if (s) {
    runda = s.runda || 0; puncte = s.puncte || []; ghiciri = s.ghiciri || [];
    done = !!s.done; win = !!s.win;
  }
  shareButton.disabled = !done;
  randeazaRunda();
  randeazaIstoric();
  actualizeazaStreak();
  updateClock();
  setInterval(updateClock, 1000);
}

shareButton.addEventListener("click", distribuie);
modalClose.addEventListener("click", () => modal.classList.remove("active"));
modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });

init();
</script>
</body>
</html>
