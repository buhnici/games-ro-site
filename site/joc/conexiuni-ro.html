<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conexiuni RO — GAMES.ro</title>
<meta name="description" content="Găsește legătura între 16 cuvinte românești. Conexiuni zilnice — gândește ca un român, joacă cu cuvinte.">
<link rel="canonical" href="https://games.ro/joc/conexiuni-ro">
<meta property="og:title" content="Conexiuni RO — GAMES.ro">
<meta property="og:description" content="Găsește legătura între 16 cuvinte românești. Conexiuni zilnice — gândește ca un român, joacă cu cuvinte.">

<meta property="og:url" content="https://games.ro/joc/conexiuni-ro">
<style>
/* ==== SURSA: site-new/tokens.css — nu edita aici ==== */
:root {
  --bg-deep: #05060f;
  --bg-mid: #0b0d1f;
  --bg-panel: rgba(10, 14, 28, 0.92);
  --bg-panel-solid: #0a0e1c;
  --bg-cabinet: rgba(8, 11, 24, 0.96);
  --neon-cyan: #00e5ff;
  --neon-magenta: #ff2e88;
  --amber: #ffb300;
  --live: #39ff88;
  --text: #f2f4ff;
  --text-dim: #9aa3c0;
  --text-faint: #5a6284;
  --font-display: "Avenir Next Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --tracking-display: 0.14em;
  --tracking-label: 0.22em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 40px;
  --space-6: 64px;
  --radius-panel: 14px;
  --radius-cabinet: 10px;
  --radius-btn: 6px;
  --border-neon: 1px solid rgba(0, 229, 255, 0.55);
  --border-neon-strong: 2px solid var(--neon-cyan);
  --border-magenta: 1px solid rgba(255, 46, 136, 0.5);
  --glow-cyan: 0 0 10px rgba(0, 229, 255, 0.55), 0 0 28px rgba(0, 229, 255, 0.22), inset 0 0 12px rgba(0, 229, 255, 0.08);
  --glow-magenta: 0 0 10px rgba(255, 46, 136, 0.5), 0 0 24px rgba(255, 46, 136, 0.2);
  --glow-amber: 0 0 12px rgba(255, 179, 0, 0.6), 0 0 30px rgba(255, 179, 0, 0.25);
  --text-glow-cyan: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 229, 255, 0.5);
  --text-glow-magenta: 0 0 10px var(--neon-magenta);
  --chromatic: -2px 0 var(--neon-cyan), 2px 0 var(--neon-magenta);
  --ease-arcade: cubic-bezier(0.2, 0.9, 0.3, 1.2);
  --speed-hover: 150ms;
  --speed-pulse: 3.5s;
  --speed-marquee: 4s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-body);
  color:var(--text);
  background:linear-gradient(180deg,var(--bg-deep) 0%,var(--bg-mid) 100%);
  min-height:100vh;
  overflow-x:hidden;
}
.console{max-width:1200px;margin:0 auto;padding:var(--space-4) var(--space-3) var(--space-5)}

/* Header */
.console-header{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);
  border:var(--border-neon-strong);border-radius:var(--radius-panel);
  background:linear-gradient(135deg,rgba(0,229,255,0.10) 0%,var(--bg-panel-solid) 100%);
}
.logo-glow{
  font-family:var(--font-mono);font-weight:700;font-size:1.3rem;
  letter-spacing:var(--tracking-display);color:var(--text);
  text-shadow:var(--chromatic),var(--text-glow-cyan);
  text-decoration:none;
}
.logo-glow span{color:var(--neon-magenta);text-shadow:var(--text-glow-magenta)}
.player-status{display:flex;gap:var(--space-4);font-family:var(--font-mono);font-size:0.85rem}
.status-label{color:var(--text-dim);text-transform:uppercase;letter-spacing:var(--tracking-label);font-size:0.7rem}
.status-value{color:var(--text);font-weight:700}
.status-value.hot{color:var(--neon-magenta);text-shadow:var(--text-glow-magenta)}
.clock{text-align:right;font-family:var(--font-mono)}
.clock-time{font-size:1rem;color:var(--neon-cyan)}
.clock-date{font-size:0.7rem;color:var(--text-dim)}

/* Game */
.game-title{
  font-family:var(--font-display);font-size:2rem;letter-spacing:var(--tracking-display);
  text-transform:uppercase;color:var(--text);
  text-shadow:var(--chromatic),var(--text-glow-cyan);
  text-align:center;margin:var(--space-4) 0 var(--space-3);
}
.game-instructions{
  font-size:0.9rem;color:var(--text-dim);text-align:center;margin-bottom:var(--space-4);
  max-width:600px;margin-left:auto;margin-right:auto;
}

/* Word grid */
.word-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3);
  max-width:900px;margin:0 auto var(--space-5);padding:var(--space-3);
}
.word-cell{
  background:var(--bg-cabinet);border:var(--border-neon);border-radius:var(--radius-cabinet);
  padding:var(--space-3);text-align:center;font-size:1.1rem;font-weight:600;
  cursor:pointer;transition:all var(--speed-hover) var(--ease-arcade);
  font-family:var(--font-body);
  color:var(--text); /* <button> nu moștenește culoarea: fără asta, UA-ul pune negru pe fundal negru */
}
.word-cell:hover:not(:disabled){
  transform:scale(1.05);border-color:var(--neon-cyan);
  box-shadow:var(--glow-cyan);
}
.word-cell:disabled{
  opacity:0.5;cursor:default;
}
.word-cell.selected,.word-cell.selected:hover{ /* :hover inclus — pe mobil hover-ul rămâne lipit după tap */
  border-color:var(--neon-magenta);box-shadow:var(--glow-magenta),inset 0 0 0 1px var(--neon-magenta);
  background:color-mix(in srgb,var(--neon-magenta) 18%,var(--bg-cabinet));
}

/* Feedback */
.feedback-area{
  text-align:center;margin-bottom:var(--space-5);
}
.feedback-message{
  font-size:1.2rem;color:var(--text);margin-bottom:var(--space-3);
  font-weight:600;
}
.feedback-message.correct{color:var(--live)}
.feedback-message.wrong{color:var(--neon-magenta)}
.feedback-message.aproape{color:var(--amber)}
.group-reveal{
  display:flex;flex-wrap:wrap;gap:var(--space-2);
  justify-content:center;margin-top:var(--space-3);
}
.group-tag{
  padding:var(--space-2) var(--space-4);
  border-radius:var(--radius-btn);
  font-family:var(--font-display);font-size:0.9rem;
  text-transform:uppercase;letter-spacing:var(--tracking-label);
}
.group-tag.found{border:var(--border-neon-strong);background:var(--bg-panel);color:var(--live)}
.group-tag.found.magenta{color:var(--neon-magenta);border-color:var(--border-magenta)}
.group-tag.found.cyan{color:var(--neon-cyan);border-color:var(--border-neon-strong)}
.group-tag.found.amber{color:var(--amber);border-color:var(--glow-amber)}

/* Action bar */
.action-bar{
  display:flex;justify-content:center;gap:var(--space-4);
  margin-bottom:var(--space-5);
}
.verify-btn, .back-btn{
  padding:var(--space-3) var(--space-6);
  border:1px solid var(--neon-cyan);
  background:var(--bg-panel);color:var(--text);
  font-family:var(--font-mono);font-size:0.85rem;font-weight:700;
  letter-spacing:var(--tracking-display);text-transform:uppercase;
  border-radius:var(--radius-btn);
  text-decoration:none;cursor:pointer;
  transition:all var(--speed-hover) var(--ease-arcade);
}
.verify-btn:hover:not(:disabled){transform:scale(1.05);border-color:var(--neon-magenta);color:var(--neon-magenta)}
.verify-btn:disabled{color:var(--text-dim);border-color:var(--text-faint);cursor:default}
.back-btn:hover{transform:scale(1.05);border-color:var(--amber);color:var(--amber)}

/* Share */
.share-section{text-align:center;margin-top:var(--space-6)}
.share-button{
  display:inline-block;padding:12px 28px;border:1px solid var(--neon-cyan);
  background:transparent;color:var(--text);font-family:var(--font-mono);font-size:0.75rem;
  font-weight:700;letter-spacing:var(--tracking-display);text-transform:uppercase;
  border-radius:var(--radius-btn);text-decoration:none;
  transition:all var(--speed-hover) var(--ease-arcade);
}
.share-button:hover:not(:disabled){transform:scale(1.04);border-color:var(--amber);color:var(--amber)}
.share-button:disabled{color:var(--text-dim);border-color:var(--text-faint);cursor:default}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.modal-overlay.active{display:flex}
.modal-content{
  background:var(--bg-panel);border:var(--border-neon-strong);
  border-radius:var(--radius-panel);padding:var(--space-5);
  max-width:450px;width:90%;text-align:center;
  box-shadow:var(--glow-cyan);
}
.modal-title{
  font-family:var(--font-display);font-size:1.8rem;letter-spacing:var(--tracking-display);
  text-transform:uppercase;color:var(--text);margin-bottom:var(--space-3);
  text-shadow:var(--text-glow-cyan);
}
.modal-message{
  font-size:1rem;color:var(--text-dim);margin-bottom:var(--space-4);
}
.modal-streak{
  font-family:var(--font-mono);font-size:2.5rem;color:var(--neon-cyan);
  margin:var(--space-3) 0;
}
.modal-btn{
  display:inline-block;padding:14px 28px;border:1px solid var(--neon-cyan);
  background:var(--bg-panel);color:var(--text);font-family:var(--font-mono);font-size:0.8rem;
  font-weight:700;letter-spacing:var(--tracking-display);text-transform:uppercase;
  border-radius:var(--radius-btn);text-decoration:none;
  transition:all var(--speed-hover) var(--ease-arcade);
  cursor:pointer;
}
.modal-btn:hover{transform:scale(1.05);border-color:var(--amber);color:var(--amber)}

/* Scanlines */
.scanlines::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0.04) 0 1px,transparent 1px 3px);
  opacity:0.5;z-index:9998;
}
.crt-vignette::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.6) 100%);
  z-index:9999;
}

/* Responsive */
@media (prefers-reduced-motion: reduce) {
  .word-cell, .verify-btn, .modal-btn { transition: none !important; }
}
@media (max-width:600px) {
  .word-grid{grid-template-columns:repeat(2,1fr)}
  .game-title{font-size:1.5rem}
  .modal-streak{font-size:2rem}
}

.word-cell.found{opacity:1;color:#000;font-weight:700}
.word-cell.g-live{background:var(--live);border-color:var(--live)}
.word-cell.g-amber{background:var(--amber);border-color:var(--amber)}
.word-cell.g-cyan{background:var(--neon-cyan);border-color:var(--neon-cyan)}
.word-cell.g-magenta{background:var(--neon-magenta);border-color:var(--neon-magenta)}
.group-tag.live{border-color:var(--live);color:var(--live)}
.group-tag.magenta{border-color:var(--neon-magenta);color:var(--neon-magenta)}
</style>
<script defer src="/consimtamant.js"></script></head>
<body class="crt-vignette scanlines">
<div class="console">
<header class="console-header">
  <a href="/" class="logo-glow">GAMES<span>.ro</span></a>
  <div class="player-status">
    <div class="clock">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="clock-date" id="clock-date">--/--/----</div>
    </div>
    <div class="status-item">
      <span class="status-label">STREAK</span>
      <span class="status-value" id="streak">0</span>
    </div>
  </div>
</header>

<h1 class="game-title">Conexiuni RO</h1>
<p class="game-instructions">Găsește 4 grupuri de 4 cuvinte care se leagă între ele. Ai 4 greșeli pe zi.</p>

<div class="word-grid" id="word-grid"></div>

<div class="action-bar">
  <button class="verify-btn" id="verify-btn">Verifică</button>
  <a href="/" class="back-btn">Înapoi</a>
</div>

<div class="feedback-area" id="feedback-area">
  <div class="feedback-message" id="feedback-message"></div>
  <div class="group-reveal" id="group-reveal"></div>
</div>

<div class="share-section">
  <button class="share-button" id="share-button" disabled>SHARE</button>
</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div class="modal-title" id="modal-title">Felicitări!</div>
    <div class="modal-message" id="modal-message"></div>
    <div class="modal-streak" id="modal-streak"></div>
    <button class="modal-btn" id="modal-close">ÎNCHIDE</button>
  </div>
</div>

<script type="module">
// ==== Conexiuni RO — logica jocului (rescriere manager v2, 17.09.2026) ====
import { GamesRO } from "/shell.js";
import { PUZZLES, puzzleZilei, ordineaZilei, evalueazaIncercare } from "./conexiuni-ro.js";

const SLUG = "conexiuni-ro";
const MAX_GRESELI = 4;
const ZI = GamesRO.seedAzi();
const STATE_KEY = "gro:" + SLUG + ":stare:" + ZI;
const CULORI = ["live", "amber", "cyan", "magenta"]; // per index de grupă în puzzle

const wordGrid = document.getElementById("word-grid");
const verifyBtn = document.getElementById("verify-btn");
const shareButton = document.getElementById("share-button");
const feedbackArea = document.getElementById("feedback-area");
const feedbackMessage = document.getElementById("feedback-message");
const groupReveal = document.getElementById("group-reveal");
const streakEl = document.getElementById("streak");
const clockTimeEl = document.getElementById("clock-time");
const clockDateEl = document.getElementById("clock-date");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modal-title");
const modalMessage = document.getElementById("modal-message");
const modalStreak = document.getElementById("modal-streak");
const modalClose = document.getElementById("modal-close");

const puzzle = PUZZLES[puzzleZilei(ZI)];
const toateCuvintele = puzzle.flatMap((g) => g.cuvinte);
const cuvinteAmestecate = ordineaZilei(ZI).map((i) => toateCuvintele[i]);
const grupaCuvantului = {}; // cuvânt → indexul grupei
puzzle.forEach((g, gi) => g.cuvinte.forEach((c) => { grupaCuvantului[c] = gi; }));

let grupeGasite = [];   // indecși de grupă, în ordinea găsirii
let greseli = 0;
let incercari = 0;
let istoric = [];       // per încercare: array de 4 indecși de grupă (pentru share)
let selectate = [];
let done = false, win = false;

function citesteStare() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!Array.isArray(s.grupeGasite)) return null;
    return s;
  } catch { return null; }
}
function salveazaStare() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({ grupeGasite, greseli, incercari, istoric, done, win }));
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.indexOf("gro:" + SLUG + ":stare:") === 0 && k !== STATE_KEY) localStorage.removeItem(k);
    }
  } catch { /* private mode */ }
}

function construiesteGrila() {
  wordGrid.innerHTML = "";
  cuvinteAmestecate.forEach((c) => {
    const btn = document.createElement("button");
    btn.className = "word-cell";
    btn.textContent = c;
    btn.dataset.word = c;
    btn.addEventListener("click", () => alege(btn, c));
    wordGrid.appendChild(btn);
  });
}

function alege(btn, cuvant) {
  if (done) return;
  if (grupeGasite.includes(grupaCuvantului[cuvant])) return;
  const poz = selectate.indexOf(cuvant);
  if (poz >= 0) { selectate.splice(poz, 1); btn.classList.remove("selected"); }
  else if (selectate.length < 4) { selectate.push(cuvant); btn.classList.add("selected"); }
  verifyBtn.disabled = selectate.length !== 4;
}

function randeaza() {
  wordGrid.querySelectorAll(".word-cell").forEach((btn) => {
    const gi = grupaCuvantului[btn.dataset.word];
    const gasita = grupeGasite.includes(gi);
    btn.classList.toggle("selected", selectate.includes(btn.dataset.word));
    btn.classList.toggle("found", gasita);
    btn.classList.toggle("g-" + CULORI[gi], gasita);
    btn.disabled = gasita || done;
  });
  groupReveal.innerHTML = "";
  grupeGasite.forEach((gi) => {
    const tag = document.createElement("div");
    tag.className = "group-tag found " + CULORI[gi];
    tag.textContent = puzzle[gi].tema + ": " + puzzle[gi].cuvinte.join(", ");
    groupReveal.appendChild(tag);
  });
  const ramase = MAX_GRESELI - greseli;
  feedbackArea.style.display = "block";
  if (!done && !feedbackMessage.textContent) {
    feedbackMessage.textContent = "Greșeli rămase: " + ramase;
    feedbackMessage.className = "feedback-message";
  }
}

function verifica() {
  if (done || selectate.length !== 4) return;
  incercari++;
  istoric.push(selectate.map((c) => grupaCuvantului[c]));
  const r = evalueazaIncercare(puzzle, selectate);

  if (r.corect) {
    grupeGasite.push(r.grupa);
    feedbackMessage.textContent = "Corect! " + r.tema + ".";
    feedbackMessage.className = "feedback-message correct";
  } else {
    greseli++;
    feedbackMessage.textContent = r.aproape
      ? "Aproape! 3 din 4 sunt din aceeași grupă. Greșeli rămase: " + (MAX_GRESELI - greseli)
      : "Nu. Greșeli rămase: " + (MAX_GRESELI - greseli);
    feedbackMessage.className = "feedback-message " + (r.aproape ? "aproape" : "wrong");
  }
  selectate = [];
  verifyBtn.disabled = true;

  if (grupeGasite.length === 4) { done = true; win = true; }
  else if (greseli >= MAX_GRESELI) { done = true; win = false; }

  salveazaStare();
  randeaza();

  if (done) {
    if (win) GamesRO.marcheazaJucat(SLUG, { incercari });
    verifyBtn.style.display = "none";
    shareButton.disabled = false;
    actualizeazaStreak();
    if (!win) dezvaluieTot();
    setTimeout(arataModal, 600);
  }
}

function dezvaluieTot() {
  groupReveal.innerHTML = "";
  puzzle.forEach((g, gi) => {
    const tag = document.createElement("div");
    tag.className = "group-tag found " + CULORI[gi];
    tag.textContent = g.tema + ": " + g.cuvinte.join(", ");
    groupReveal.appendChild(tag);
  });
}

function actualizeazaStreak() { streakEl.textContent = GamesRO.streak(SLUG); }

function arataModal() {
  if (win) {
    modalTitle.textContent = "Felicitări!";
    modalTitle.style.color = "var(--live)";
    modalMessage.textContent = "Ai găsit toate grupele din " + incercari + " încercări. Revino mâine pentru alt puzzle!";
  } else {
    modalTitle.textContent = "Nu de data asta...";
    modalTitle.style.color = "var(--neon-magenta)";
    modalMessage.textContent = "S-au terminat cele " + MAX_GRESELI + " greșeli. Grupele sunt dezvăluite mai jos. Revino mâine!";
  }
  modalStreak.textContent = "STREAK " + GamesRO.streak(SLUG);
  modal.classList.add("active");
}

async function distribuie() {
  if (!done) return;
  const EMOJI = ["🟩", "🟨", "🟦", "🟪"];
  const grila = istoric.map((rand) => rand.map((gi) => EMOJI[gi]).join("")).join("\n");
  const scor = win ? incercari + " încercări, " + greseli + " greșeli" : "X (" + grupeGasite.length + "/4 grupe)";
  const out = await GamesRO.share(SLUG, grila, scor);
  if (out === "copied") feedbackShare("COPIAT!");
  else if (out === false) feedbackShare("COPIAZĂ MANUAL");
}

let shareTimer = null;
function feedbackShare(t) {
  shareButton.textContent = t;
  clearTimeout(shareTimer);
  shareTimer = setTimeout(() => { shareButton.textContent = "SHARE"; }, 1500);
}

function updateClock() {
  const now = new Date();
  clockTimeEl.textContent = now.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
  clockDateEl.textContent = now.toLocaleDateString("ro-RO", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function init() {
  construiesteGrila();
  const s = citesteStare();
  if (s) {
    grupeGasite = s.grupeGasite; greseli = s.greseli || 0; incercari = s.incercari || 0;
    istoric = s.istoric || []; done = !!s.done; win = !!s.win;
  }
  shareButton.disabled = !done;
  if (done) { verifyBtn.style.display = "none"; if (!win) dezvaluieTot(); }
  verifyBtn.disabled = true;
  randeaza();
  actualizeazaStreak();
  updateClock();
  setInterval(updateClock, 1000);
}

verifyBtn.addEventListener("click", verifica);
shareButton.addEventListener("click", distribuie);
modalClose.addEventListener("click", () => modal.classList.remove("active"));
modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });

init();
</script>
</body>
</html>
