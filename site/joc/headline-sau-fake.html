<style>
/* ==== SURSA: site-new/tokens.css — nu edita aici ==== */
:root {
  --bg-deep: #05060f;
  --bg-mid: #0b0d1f;

  --bg-panel-solid: #0a0e1c;

  --live: #39ff88;

  --font-display: "Avenir Next Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --tracking-display: 0.14em;
  --tracking-label: 0.22em;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 40px;
  --radius-panel: 14px;
  --radius-cabinet: 10px;
  --radius-btn: 6px;
  --border-neon: 1px solid rgba(0, 229, 255, 0.55);
  --border-neon-strong: 2px solid var(--neon-cyan);
  --border-magenta: 1px solid rgba(255, 46, 136, 0.5);
  --glow-cyan: 0 0 10px rgba(0, 229, 255, 0.55), 0 0 28px rgba(0, 229, 255, 0.22), inset 0 0 12px rgba(0, 229, 255, 0.08);
  --glow-magenta: 0 0 10px rgba(255, 46, 136, 0.5), 0 0 24px rgba(255, 46, 136, 0.2);
  --glow-amber: 0 0 12px rgba(255, 179, 0, 0.6), 0 0 30px rgba(255, 179, 0, 0.25);
  --text-glow-cyan: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 229, 255, 0.5);
  --text-glow-magenta: 0 0 10px var(--neon-magenta);
  --chromatic: -2px 0 var(--neon-cyan), 2px 0 var(--neon-magenta);
  --ease-arcade: cubic-bezier(0.2, 0.9, 0.3, 1.2);
  --speed-hover: 150ms;
  --speed-pulse: 3.5s;
  --speed-marquee: 4s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-body);
  color:var(--text);
  background:linear-gradient(180deg,var(--bg-deep) 0%,var(--bg-mid) 100%);
  min-height:100vh;
  overflow-x:hidden;
}
.console{max-width:1000px;margin:0 auto;padding:var(--space-4) var(--space-3) var(--space-5)}
.console-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);
  border:var(--border-neon-strong);border-radius:var(--radius-panel);
  background:linear-gradient(135deg,rgba(0,229,255,0.10) 0%,var(--bg-panel-solid) 100%);
}
.logo-glow{
  font-family:var(--font-mono);font-weight:700;font-size:1.3rem;
  letter-spacing:var(--tracking-display);color:var(--text);
  text-shadow:var(--chromatic),var(--text-glow-cyan);
  text-decoration:none;
}
.logo-glow span{color:var(--neon-magenta);text-shadow:var(--text-glow-magenta)}
.player-status{display:flex;gap:var(--space-4);font-family:var(--font-mono);font-size:0.85rem}
.status-label{color:var(--text-dim);text-transform:uppercase;letter-spacing:var(--tracking-label);font-size:0.7rem}
.status-value{color:var(--text);font-weight:700}
.status-value.hot{color:var(--neon-magenta);text-shadow:var(--text-glow-magenta)}
.clock{text-align:right;font-family:var(--font-mono)}
.clock-time{font-size:1rem;color:var(--neon-cyan)}
.clock-date{font-size:0.7rem;color:var(--text-dim)}

.game-title{
  font-family:var(--font-display);font-size:2rem;letter-spacing:var(--tracking-display);
  text-transform:uppercase;color:var(--text);
  text-shadow:var(--chromatic),var(--text-glow-cyan);
  text-align:center;margin:var(--space-4) 0 var(--space-3);
}
.game-instructions{
  font-size:0.9rem;color:var(--text-dim);text-align:center;margin-bottom:var(--space-5);
}

.statement-item{
  margin-bottom:var(--space-3);padding:var(--space-3);background:var(--bg-panel);
  border:1px solid rgba(0,229,255,0.3);border-radius:var(--radius-btn);
  transition:transform var(--speed-hover) var(--ease-arcade),border-color var(--speed-hover) ease;
}
.statement-item:hover:not(.disabled){
  transform:translateY(-2px);border-color:var(--neon-cyan);
}
.statement-item.disabled{opacity:0.5;pointer-events:none}

.statement-text{
  font-size:1rem;margin-bottom:var(--space-2);font-weight:500;
}
.statement-text.correct{color:var(--live)}
.statement-text.fake{color:var(--neon-magenta)}

.statement-reveal{
  margin-top:var(--space-2);font-size:0.9rem;color:var(--text-dim);
  border-top:1px solid rgba(255,255,255,0.1);
  padding-top:var(--space-2);
}
.reveal-answer{color:var(--text);font-weight:700}
.reveal-explanation{color:var(--text-dim);font-style:italic}

.answer-options{
  display:flex;gap:var(--space-2);margin-top:var(--space-2);
}
.option-btn{
  flex:1;padding:12px 20px;
  border:1px solid var(--neon-cyan);border-radius:var(--radius-btn);
  font-family:var(--font-mono);font-size:0.9rem;font-weight:700;
  color:var(--text);background:var(--bg-cabinet);
  cursor:pointer;transition:transform var(--speed-hover) var(--ease-arcade),background var(--speed-hover) ease,color var(--speed-hover) ease;
  text-transform:uppercase;letter-spacing:var(--tracking-display);
}
.option-btn:hover:not(:disabled){
  transform:scale(1.04);border-color:var(--amber);color:var(--amber);box-shadow:var(--glow-amber);
}
.option-btn:disabled{opacity:0.3;cursor:default}

.score-display{
  text-align:center;margin-top:var(--space-5);padding:var(--space-4);
  background:var(--bg-panel);border:var(--border-neon-strong);
  border-radius:var(--radius-panel);
}
.score-value{
  font-family:var(--font-mono);font-size:3rem;color:var(--neon-cyan);
  font-weight:700;text-shadow:var(--text-glow-cyan);
}
.score-label{
  font-size:1.2rem;color:var(--text-dim);text-transform:uppercase;
  letter-spacing:var(--tracking-label);
}

.share-section{text-align:center;margin-top:var(--space-4)}
.share-button{
  display:inline-block;padding:12px 28px;border:1px solid var(--neon-cyan);
  background:transparent;color:var(--text);font-family:var(--font-mono);font-size:0.75rem;
  font-weight:700;letter-spacing:var(--tracking-display);text-transform:uppercase;
  border-radius:var(--radius-btn);text-decoration:none;
  transition:transform var(--speed-hover) var(--ease-arcade),box-shadow var(--speed-hover) ease,color var(--speed-hover) ease;
}
.share-button:hover:not(:disabled){transform:scale(1.04);border-color:var(--amber);color:var(--amber);box-shadow:var(--glow-amber)}
.share-button:disabled{opacity:0.3;cursor:default}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.modal-overlay.active{display:flex}
.modal-content{
  background:var(--bg-panel);border:var(--border-neon-strong);
  border-radius:var(--radius-panel);padding:var(--space-5);
  max-width:400px;width:90%;
  text-align:center;
  box-shadow:var(--glow-cyan);
}
.modal-title{
  font-family:var(--font-display);font-size:1.5rem;letter-spacing:var(--tracking-display);
  text-transform:uppercase;color:var(--text);margin-bottom:var(--space-3);
  text-shadow:var(--text-glow-cyan);
}
.modal-message{
  font-size:1rem;color:var(--text-dim);margin-bottom:var(--space-4);
}
.modal-streak{
  font-family:var(--font-mono);font-size:2rem;color:var(--neon-cyan);
  margin:var(--space-3) 0;
}
.modal-btn{
  display:inline-block;padding:12px 24px;border:1px solid var(--neon-cyan);
  background:var(--bg-panel);color:var(--text);font-family:var(--font-mono);font-size:0.8rem;
  font-weight:700;letter-spacing:var(--tracking-display);text-transform:uppercase;
  border-radius:var(--radius-btn);text-decoration:none;
  transition:transform var(--speed-hover) var(--ease-arcade),box-shadow var(--speed-hover) ease,color var(--speed-hover) ease;
}
.modal-btn:hover{transform:scale(1.04);border-color:var(--amber);color:var(--amber);box-shadow:var(--glow-amber)}

/* Scanlines */
.scanlines::after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0.05) 0 1px,transparent 1px 3px);
  opacity:0.55;z-index:9998;
}
.crt-vignette::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,0.55) 100%);
  z-index:9999;
}

/* Responsive */
@media (prefers-reduced-motion: reduce) {
  .option-btn, .statement-item { transition: none !important; animation: none !important; }
}

/* Mobile */
@media (max-width:480px) {
  .game-title{font-size:1.6rem}
  .statement-text{font-size:0.9rem}
  .option-btn{font-size:0.8rem;padding:10px 16px}
  .score-value{font-size:2.5rem}
}

<body class="crt-vignette scanlines">
<div class="console">
<header class="console-header">
  <a href="/" class="logo-glow">GAMES<span>.ro</span></a>
  <div class="player-status">
    <div class="clock">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="clock-date" id="clock-date">--/--/----</div>
    </div>
    <div class="status-item">
      <span class="status-label">STREAK</span>
      <span class="status-value" id="streak">0</span>
    </div>
  </div>
</header>

<h1 class="game-title">Headline sau Fake?</h1>
<p class="game-instructions">Ghicește dacă știrea e reală sau inventată. Ai 8 întrebări.</p>

<div id="statements-container"></div>

<div class="score-display" id="score-display" style="display:none;">
  <div class="score-value"><span id="score">0</span>/8</div>
  <div class="score-label">puncte</div>
</div>

<div class="share-section">
  <button class="share-button" id="share-button" disabled>SHARE</button>
</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div class="modal-title" id="modal-title">Felicitări!</div>
    <div class="modal-message" id="modal-message"></div>
    <div class="modal-streak" id="modal-streak"></div>
    <button class="modal-btn" id="modal-close">ÎNCHIDE</button>
  </div>
</div>

<script type="module">
// ==== Headline sau Fake? — logica jocului (rescriere manager v2, 17.09.2026) ====
import { GamesRO } from "/shell.js";
import { INTREBARI, intrebarileZilei } from "./headline-sau-fake.js";

const SLUG = "headline-sau-fake";
const ZI = GamesRO.seedAzi();
const STATE_KEY = "gro:" + SLUG + ":stare:" + ZI;
const PRAG_VICTORIE = 6;

const statementsContainer = document.getElementById("statements-container");
const scoreDisplay = document.getElementById("score-display");
const scoreEl = document.getElementById("score");
const shareButton = document.getElementById("share-button");
const streakEl = document.getElementById("streak");
const clockTimeEl = document.getElementById("clock-time");
const clockDateEl = document.getElementById("clock-date");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modal-title");
const modalMessage = document.getElementById("modal-message");
const modalStreak = document.getElementById("modal-streak");
const modalClose = document.getElementById("modal-close");

const intrebari = intrebarileZilei(ZI).map((i) => INTREBARI[i]);

let raspunsuri = [];  // per întrebare: true/false ales, sau undefined
let done = false, win = false;

const corecte = () => intrebari.reduce((n, q, i) => n + (raspunsuri[i] === q.adevarat ? 1 : 0), 0);
const raspunse = () => raspunsuri.filter((r) => r !== undefined && r !== null).length;

function citesteStare() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!Array.isArray(s.raspunsuri)) return null;
    return s;
  } catch { return null; }
}
function salveazaStare() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({ raspunsuri, done, win }));
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.indexOf("gro:" + SLUG + ":stare:") === 0 && k !== STATE_KEY) localStorage.removeItem(k);
    }
  } catch { /* private mode */ }
}

function raspunde(i, valoare) {
  if (done || raspunsuri[i] !== undefined) return;
  raspunsuri[i] = valoare;
  if (raspunse() === 8) {
    done = true;
    win = corecte() >= PRAG_VICTORIE;
    if (win) GamesRO.marcheazaJucat(SLUG, { corecte: corecte() });
    shareButton.disabled = false;
    actualizeazaStreak();
    setTimeout(arataModal, 700);
  }
  salveazaStare();
  randeaza();
}

function randeaza() {
  statementsContainer.innerHTML = "";
  intrebari.forEach((q, i) => {
    const ales = raspunsuri[i];
    const raspunsa = ales !== undefined && ales !== null;
    const div = document.createElement("div");
    div.className = "statement-item";

    const text = document.createElement("div");
    text.className = "statement-text";
    text.textContent = (i + 1) + ". " + q.text;
    div.appendChild(text);

    if (raspunsa) {
      const corect = ales === q.adevarat;
      const reveal = document.createElement("div");
      reveal.className = "statement-reveal";
      reveal.style.cssText = "margin-top:8px;padding:10px 12px;border-left:3px solid " +
        (corect ? "var(--live)" : "var(--neon-magenta)") + ";background:rgba(0,229,255,0.04)";
      reveal.innerHTML =
        '<div style="font-family:var(--font-mono);font-size:0.8rem;letter-spacing:var(--tracking-label);color:' +
        (corect ? "var(--live)" : "var(--neon-magenta)") + '">' +
        (corect ? "CORECT" : "GREȘIT") + ' — era ' + (q.adevarat ? "ADEVĂRAT" : "FAKE") + '</div>' +
        '<div style="color:var(--text-dim);font-size:0.85rem;margin-top:4px">' + q.explicatie + '</div>';
      div.appendChild(reveal);
    } else {
      const opts = document.createElement("div");
      opts.className = "answer-options";
      const fa = (eticheta, val) => {
        const b = document.createElement("button");
        b.className = "option-btn";
        b.textContent = eticheta;
        b.disabled = done;
        b.addEventListener("click", () => raspunde(i, val));
        return b;
      };
      opts.appendChild(fa("ADEVĂRAT", true));
      opts.appendChild(fa("FAKE", false));
      div.appendChild(opts);
    }
    statementsContainer.appendChild(div);
  });
  scoreDisplay.style.display = "block";
  scoreEl.textContent = corecte() + " / " + raspunse();
}

function actualizeazaStreak() { streakEl.textContent = GamesRO.streak(SLUG); }

function arataModal() {
  const c = corecte();
  if (win) {
    modalTitle.textContent = "Felicitări!";
    modalTitle.style.color = "var(--live)";
    modalMessage.textContent = "Ai nimerit " + c + " din 8. Pragul era " + PRAG_VICTORIE + ". Revino mâine pentru alte afirmații!";
  } else {
    modalTitle.textContent = "Nu de data asta...";
    modalTitle.style.color = "var(--neon-magenta)";
    modalMessage.textContent = "Ai nimerit " + c + " din 8, sub pragul de " + PRAG_VICTORIE + ". Explicațiile sunt mai sus. Revanșa: mâine!";
  }
  modalStreak.textContent = "STREAK " + GamesRO.streak(SLUG);
  modal.classList.add("active");
}

async function distribuie() {
  if (!done) return;
  const grila = intrebari.map((q, i) => (raspunsuri[i] === q.adevarat ? "🟩" : "⬛")).join("");
  const out = await GamesRO.share(SLUG, grila, corecte() + "/8");
  if (out === "copied") feedbackShare("COPIAT!");
  else if (out === false) feedbackShare("COPIAZĂ MANUAL");
}

let shareTimer = null;
function feedbackShare(t) {
  shareButton.textContent = t;
  clearTimeout(shareTimer);
  shareTimer = setTimeout(() => { shareButton.textContent = "SHARE"; }, 1600);
}

function updateClock() {
  const now = new Date();
  clockTimeEl.textContent = now.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
  clockDateEl.textContent = now.toLocaleDateString("ro-RO", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function init() {
  const s = citesteStare();
  if (s) { raspunsuri = s.raspunsuri; done = !!s.done; win = !!s.win; }
  shareButton.disabled = !done;
  shareButton.addEventListener("click", distribuie);
  modalClose.addEventListener("click", () => modal.classList.remove("active"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });
  randeaza();
  actualizeazaStreak();
  updateClock();
  setInterval(updateClock, 1000);
}

init();
</script>
