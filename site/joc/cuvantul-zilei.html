<script type="module">
// ==== Cuvântul Zilei — logica jocului (rescriere manager, 2026-08-27) ====
// SDK-ul comun se încarcă modul real de la rădăcină — sursă unică, fără copii inline.
import { GamesRO } from "/shell.js";

const SLUG = "cuvantul-zilei";
const MAX_GUESSES = 6;

/* Cuvintele-secret: românești comune, exact 5 litere, fără diacritice (317).
   Ghicirile NU se validează contra listei — o listă mică ar respinge pe nedrept
   cuvinte reale, așa că orice combinație de 5 litere e acceptată ca încercare. */
const WORDS = [
  "acasa","acord","actor","adult","album","altar","amurg","anexa","antic","anual",
  "apune","arama","arici","aripa","aroma","atent","atlas","autor","avere","avion",

  "capac","capra","carne","carte","casca","catel","cauza","cazan","ceapa","ceara",
  "ceata","cheie","cifra","cinci","cires","citat","civil","clima","coada","coaja",
  "coase","cocor","cocos","codru","colac","coleg","colet","comun","copac","copil",
  "covor","crema","cuier","culme","cuplu","curaj","curea","cursa","curte","cutie",
  "dalta","dansa","decor","deget","desen","dinte","doina","dulap","dulce","dunga",
  "ecran","efort","epoca","exact","faina","fapta","fazan","felie","ferma","ficat",
  "fiert","final","firma","flaut","foaie","forma","frate","fruct","funie","furca",
  "fusta","gaina","garaj","gasca","gazda","ghete","gluma","glont","graba","grija",
  "grota","gutui","haina","halat","hamac","harta","hotel","hrean","iarba","iarna",
  "iaurt","inalt","inima","iulie","iunie","izvor","lacat","lalea","lampa","lapte",
  "liber","liceu","limba","linie","lista","litru","local","lucru","lunar","lunca",
  "lupta","magar","marfa","masca","mediu","merit","metal","metru","miere","minge",
  "minte","minut","moale","moara","model","morar","motan","motor","munca","munte",
  "musca","muzeu","negru","nepot","ninge","nisip","nivel","norma","noroc","notar",
  "nufar","numar","oaste","obraz","ocean","omida","opera","ordin","pahar","paine",
  "palat","palma","panou","panza","papuc","parau","pasaj","pasta","patru","pauza",
  "perie","perla","perna","peron","peste","piesa","pilot","pirat","plaja","plasa",
  "plata","plumb","podea","pofta","polei","popor","posta","print","proba","pruna",
  "punct","punga","punte","radio","retea","rival","roata","robot","roman","sabie",
  "salam","salon","salut","sanie","sapte","sapun","sarat","sarma","sarpe","sarut",
  "scara","scaun","scena","scris","scump","scund","secol","senin","sfert","sirop",
  "soare","sofer","somon","sonda","spate","sport","spuma","steag","stofa","strat",
  "sunet","sursa","surub","tabla","talpa","tanar","tasta","tavan","teava","teren",
  "tigru","titlu","topor","tufis","turta","umbra","unchi","uzina","vagon","vapor",
  "varza","vatra","vecin","verde","vesel","veste","viata","vidra","vifor","vitel",
  "volan","vreme","vulpe","zahar","zeama","zebra","zidar"
];

/* Amestec determinist (xorshift): fără el, zilele consecutive ar nimeri cuvinte
   alfabetic vecine din listă. Același rezultat pentru toți jucătorii în aceeași zi. */
function indexZi(seed, n) {
  let x = seed >>> 0;
  x ^= (x << 13) >>> 0;
  x ^= x >>> 17;
  x ^= (x << 5) >>> 0;
  return x % n;
}

const ZI = GamesRO.seedAzi();
const SECRET = WORDS[indexZi(ZI, WORDS.length)].toUpperCase();
const STATE_KEY = "gro:" + SLUG + ":stare:" + ZI;

// Referințe UI
const guessGrid = document.getElementById("guess-grid");
const keyboard = document.getElementById("keyboard");
const shareButton = document.getElementById("share-button");
const streakEl = document.getElementById("streak");
const clockTimeEl = document.getElementById("clock-time");
const clockDateEl = document.getElementById("clock-date");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modal-title");
const modalMessage = document.getElementById("modal-message");
const modalStreak = document.getElementById("modal-streak");
const modalClose = document.getElementById("modal-close");

// Stare
let guesses = [];      // încercări trimise (string, MAJUSCULE)
let results = [];      // verdictele memorate pe rând: "correct" | "present" | "absent"
let currentGuess = []; // literele rândului în lucru
let done = false;
let win = false;
let cells = [];

/* Persistența zilei: reload-ul păstrează tabla; ziua încheiată rămâne încheiată. */
function citesteStare() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!Array.isArray(s.guesses) || !Array.isArray(s.results)) return null;
    return s;
  } catch { return null; }
}
function salveazaStare() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({ guesses, results, done, win }));
    // igienă: stările zilelor trecute nu mai folosesc (day-mark-urile SDK rămân neatinse)
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.indexOf("gro:" + SLUG + ":stare:") === 0 && k !== STATE_KEY) localStorage.removeItem(k);
    }
  } catch { /* private mode — jocul merge, doar nu persistă */ }
}

/* Algoritmul Wordle corect: pozițiile exacte întâi, apoi prezențele
   pe bugetul literelor rămase — duplicatele nu se supra-colorează. */
function evalueaza(guess, secret) {
  const res = new Array(5).fill("absent");
  const ramase = {};
  for (let i = 0; i < 5; i++) {
    if (guess[i] === secret[i]) res[i] = "correct";
    else ramase[secret[i]] = (ramase[secret[i]] || 0) + 1;
  }
  for (let i = 0; i < 5; i++) {
    if (res[i] === "absent" && ramase[guess[i]] > 0) {
      res[i] = "present";
      ramase[guess[i]] -= 1;
    }
  }
  return res;
}

function renderGrid() {
  for (let r = 0; r < MAX_GUESSES; r++) {
    for (let c = 0; c < 5; c++) {
      const cell = cells[r * 5 + c];
      if (r < guesses.length) {
        cell.textContent = guesses[r][c];
        cell.className = "guess-cell " + results[r][c];
      } else if (r === guesses.length && !done) {
        cell.textContent = currentGuess[c] || "";
        cell.className = "guess-cell" + (currentGuess[c] ? " filled" : "");
      } else {
        cell.textContent = "";
        cell.className = "guess-cell" + (done ? " disabled" : "");
      }
    }
  }
}

const RANG = { absent: 1, present: 2, correct: 3 };
function updateKeyboard() {
  const best = {};
  for (let r = 0; r < guesses.length; r++) {
    for (let c = 0; c < 5; c++) {
      const L = guesses[r][c];
      const s = results[r][c];
      if (!best[L] || RANG[s] > RANG[best[L]]) best[L] = s;
    }
  }
  keyboard.querySelectorAll(".key").forEach((k) => {
    const L = k.dataset.key;
    if (!L || L.length !== 1) return;
    k.className = "key" + (best[L] ? " " + best[L] : "");
  });
}

function flashEroare() {
  const start = guesses.length * 5;
  const rand = cells.slice(start, start + 5);
  rand.forEach((c) => c.classList.add("eroare"));
  setTimeout(() => rand.forEach((c) => c.classList.remove("eroare")), 350);
}

function actualizeazaStreak() {
  streakEl.textContent = GamesRO.streak(SLUG);
}

function activeazaShare() {
  shareButton.disabled = false;
}

function arataModal() {
  if (win) {
    modalTitle.textContent = "Felicitări!";
    modalTitle.style.color = "var(--live)";
    modalMessage.textContent = "Ai ghicit din " + guesses.length + "/6 încercări. Revino mâine pentru următorul cuvânt.";
  } else {
    modalTitle.textContent = "Nu de data asta...";
    modalTitle.style.color = "var(--neon-magenta)";
    modalMessage.textContent = "Cuvântul zilei era \u201e" + SECRET + "\u201d. Revino mâine pentru revanșă.";
  }
  modalStreak.textContent = "STREAK " + GamesRO.streak(SLUG);
  modal.classList.add("active");
}

function inchideModal() {
  modal.classList.remove("active");
}

function trimite() {
  if (currentGuess.length < 5) { flashEroare(); return; }
  const guess = currentGuess.join("");
  const res = evalueaza(guess, SECRET);
  guesses.push(guess);
  results.push(res);
  currentGuess = [];
  if (guess === SECRET) { done = true; win = true; }
  else if (guesses.length >= MAX_GUESSES) { done = true; win = false; }
  salveazaStare();
  renderGrid();
  updateKeyboard();
  if (done) {
    if (win) GamesRO.marcheazaJucat(SLUG, { incercari: guesses.length });
    actualizeazaStreak();
    activeazaShare();
    setTimeout(arataModal, 450);
  }
}

function handleKey(key) {
  if (done) return;
  if (key === "ENTER") {
    trimite();
  } else if (key === "BACKSPACE") {
    currentGuess.pop();
    renderGrid();
  } else if (currentGuess.length < 5) {
    currentGuess.push(key);
    renderGrid();
  }
}

/* Diacriticele tastate fizic se pliază pe litera de bază (Ș→S, Ă→A...). */
const FOLD = { "\u0102": "A", "\u00c2": "A", "\u00ce": "I", "\u0218": "S", "\u021a": "T", "\u015e": "S", "\u0162": "T" };
function onKeydown(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  let k = e.key.toUpperCase();
  if (FOLD[k]) k = FOLD[k];
  if (k === "ENTER") { e.preventDefault(); handleKey("ENTER"); }
  else if (k === "BACKSPACE") { handleKey("BACKSPACE"); }
  else if (/^[A-Z]$/.test(k) && k.length === 1) { handleKey(k); }
}

async function distribuie() {
  const grila = results
    .map((r) => r.map((s) => (s === "correct" ? "\ud83d\udfe9" : s === "present" ? "\ud83d\udfe8" : "\u2b1b")).join(""))
    .join("\n");
  const scor = (win ? guesses.length : "X") + "/6";
  const out = await GamesRO.share(SLUG, grila, scor);
  if (out === "copied") feedbackShare("COPIAT!");
  else if (out === false) feedbackShare("COPIAZ\u0102 MANUAL");
}

let shareTimer = null;
function feedbackShare(text) {
  shareButton.textContent = text;
  clearTimeout(shareTimer);
  shareTimer = setTimeout(() => { shareButton.textContent = "SHARE"; }, 1600);
}

function updateClock() {
  const now = new Date();
  clockTimeEl.textContent = now.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
  clockDateEl.textContent = now.toLocaleDateString("ro-RO", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function init() {
  // Grila 6×5
  guessGrid.innerHTML = "";
  cells = [];
  for (let i = 0; i < MAX_GUESSES * 5; i++) {
    const cell = document.createElement("div");
    cell.className = "guess-cell";
    guessGrid.appendChild(cell);
    cells.push(cell);
  }

  // Tastatura QWERTY + ENTER/BACKSPACE pe rândul 3
  const RANDURI = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  keyboard.innerHTML = "";
  RANDURI.forEach((rowStr, idx) => {
    const rowDiv = document.createElement("div");
    rowDiv.className = "keyboard-row";
    const adauga = (dataKey, id, label) => {
      const b = document.createElement("button");
      b.className = "key";
      b.dataset.key = dataKey;
      b.textContent = label;
      if (id) b.id = id;
      b.addEventListener("click", () => { b.blur(); handleKey(dataKey); });
      rowDiv.appendChild(b);
    };
    if (idx === 2) adauga("ENTER", "keyboard-enter", "ENTER");
    for (const ch of rowStr) adauga(ch, null, ch);
    if (idx === 2) adauga("BACKSPACE", "keyboard-backspace", "\u2190");
    keyboard.appendChild(rowDiv);
  });

  document.addEventListener("keydown", onKeydown);
  shareButton.addEventListener("click", distribuie);
  modalClose.addEventListener("click", inchideModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) inchideModal(); });

  // Restaurarea zilei curente (tabla + starea încheiat/câștigat)
  const s = citesteStare();
  if (s) {
    guesses = s.guesses;
    results = s.results;
    done = !!s.done;
    win = !!s.win;
  }
  shareButton.disabled = !done;

  renderGrid();
  updateKeyboard();
  actualizeazaStreak();
  updateClock();
  setInterval(updateClock, 1000);
}

init();
</script>
</body>
</html>
