<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezultat GeoRo — GAMES.ro</title>
  <style>
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #f4f1ea;
        --bg-alt: #e8e4dc;
        --text: #1a1a1a;
        --text-muted: #6b6b6b;
        --border: #d1ccc4;
        --accent: #d44536;
        --accent-light: rgba(212, 69, 54, 0.08);
        --font-headings: Georgia, 'Times New Roman', serif;
        --font-body: 'Helvetica Neue', 'Arial', system-ui, sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
      }

      a {
        color: #000;
      }

      .share-card {
        background: var(--bg-alt);
        border-color: var(--border);
      }

      .result-badge {
        background: var(--accent);
        color: #fff;
      }

      .highlight-value {
        color: var(--accent);
      }

      .btn-primary {
        background: var(--accent);
      }

      .btn-primary:hover {
        background: #b93b2e;
      }

      .btn-secondary {
        background: var(--bg-alt);
        border-color: var(--border);
      }

      .btn-secondary:hover {
        border-color: var(--accent);
      }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fff;
        --bg-alt: #f8f6f3;
        --text: #111;
        --text-muted: #555;
        --border: #e2dcd4;
        --accent: #d44536;
        --accent-light: rgba(212, 69, 54, 0.06);
        --font-headings: Georgia, 'Times New Roman', serif;
        --font-body: 'Helvetica Neue', 'Arial', system-ui, sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .share-card {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    @media(min-width: 768px) {
      .share-card {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .share-visual {
      flex: 1;
    }

    .result-card {
      background: linear-gradient(180deg, rgba(212, 69, 54, 0.03) 0%, transparent 100%);
      border: 2px solid var(--accent);
      padding: 2.5rem;
      text-align: center;
    }

    .result-badge {
      display: inline-block;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: var(--accent);
      color: #fff;
      padding: 0.5rem 1.5rem;
      border-radius: 99px;
      margin-bottom: 1.5rem;
    }

    .result-emoji {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .result-score {
      font-family: var(--font-headings);
      font-size: 4.5rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }

    .result-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .result-game {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-family: var(--font-headings);
      font-size: 1.75rem;
      font-weight: 700;
    }

    .share-content {
      flex: 1.5;
    }

    .share-content h1 {
      font-family: var(--font-headings);
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 1rem;
    }

    .share-content h1 .accent {
      color: var(--accent);
    }

    .share-content p {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.7;
    }

    .share-highlights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .highlight-item {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      padding: 1.25rem;
      text-align: center;
    }

    .highlight-value {
      font-family: var(--font-headings);
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .highlight-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .share-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media(min-width: 768px) {
      .share-actions {
        flex-direction: row;
      }
    }

    .btn {
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 1rem 2rem;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      flex: 1;
    }

    .btn-primary:hover {
      background: #b93b2e;
    }

    .btn-secondary {
      background: var(--bg-alt);
      border-color: var(--border);
      color: var(--text);
      flex: 1;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    .share-footer {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .share-footer a {
      color: var(--accent);
    }

    @media(max-width: 768px) {
      .share-card {
        padding: 2rem;
      }

      .share-content h1 {
        font-size: 2rem;
      }

      .share-content p {
        font-size: 0.875rem;
      }
    }
  </style>
</head>
<body>
  <div class="share-card">
    <div class="share-visual">
      <div class="result-card">
        <span class="result-badge">Ziua 142</span>
        <div class="result-emoji">🗺️</div>
        <div class="result-score">4,231</div>
        <div class="result-label">Puncte GeoRo</div>
        <div class="result-game">GeoRo</div>
      </div>
    </div>

    <div class="share-content">
      <h1>Rezultat GeoRo <span class="accent">✓</span></h1>
      <p>Îți place de GeoRo? Distribuie scorul și invită prietenii la provocare. Vezi ce locații poti ghici mâine și ce scor ai reușit să obții astăzi.</p>

      <div class="share-highlights">
        <div class="highlight-item">
          <div class="highlight-value">4,231</div>
          <div class="highlight-label">Puncte</div>
        </div>
        <div class="highlight-item">
          <div class="highlight-value">🔥</div>
          <div class="highlight-label">Streak</div>
        </div>
        <div class="highlight-item">
          <div class="highlight-value">🗺️</div>
          <div class="highlight-label">Ziua</div>
        </div>
      </div>

      <div class="share-actions">
        <a href="/" class="btn btn-primary">Joacă din nou</a>
        <a href="https://games.ro" target="_blank" class="btn btn-secondary">games.ro</a>
      </div>

      <div class="share-footer">
        Un proiect de <a href="https://buhnici.ro" target="_blank">George Buhnici</a>
      </div>
    </div>
  </div>
</body>
</html>
