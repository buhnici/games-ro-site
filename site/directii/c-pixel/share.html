<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoRo — Rezultat — GAMES.ro</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --bg-alt: #1a1a1a;
      --text: #e8e8e8;
      --text-muted: #888;
      --accent: #ff8c00;
      --border: #333;
      --success: #00ff41;
      --font-pixel: 'Courier New', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .share-card {
      max-width: 1200px;
      width: 100%;
      background: var(--bg-alt);
      border: 4px solid var(--border);
      padding: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    @media(min-width: 768px) {
      .share-card {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .share-visual {
      flex: 1;
    }

    .game-result {
      background: var(--bg);
      border: 3px solid var(--success);
      padding: 2rem;
      text-align: center;
      font-family: var(--font-pixel);
    }

    .result-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: var(--success);
      color: #000;
      padding: 0.375rem 1rem;
      margin-bottom: 1.5rem;
    }

    .result-emoji {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .result-score {
      font-size: 4rem;
      font-weight: bold;
      color: var(--success);
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .result-label {
      font-size: 1rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .result-game {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 3px solid var(--border);
      font-size: 1.5rem;
      font-weight: bold;
    }

    .share-content {
      flex: 1.5;
    }

    .share-content h1 {
      font-size: clamp(2rem, 4vw, 2.5rem);
      font-weight: bold;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
      font-family: var(--font-pixel);
    }

    .share-content h1 .accent {
      color: var(--accent);
    }

    .share-content p {
      font-size: 1.125rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .share-highlights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .highlight-item {
      background: var(--bg);
      border: 3px solid var(--border);
      padding: 1.25rem;
      text-align: center;
    }

    .highlight-value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    .highlight-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.5rem;
    }

    .share-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media(min-width: 768px) {
      .share-actions {
        flex-direction: row;
      }
    }

    .btn {
      font-family: var(--font-pixel);
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 1rem 2rem;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 900;
    }

    .btn-primary:hover {
      background: #ffa500;
    }

    .share-footer {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 4px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .share-footer a {
      color: var(--text);
      font-family: var(--font-sans);
    }

    @media(max-width: 768px) {
      .share-card {
        padding: 2rem;
      }

      .share-content h1 {
        font-size: 2rem;
      }

      .share-content p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="share-card">
    <div class="share-visual">
      <div class="game-result">
        <span class="result-badge">ZIUA 142</span>
        <div class="result-emoji">🗺️</div>
        <div class="result-score">4,231</div>
        <div class="result-label">PUNCTE GEORO</div>
        <div class="result-game">GeoRo</div>
      </div>
    </div>

    <div class="share-content">
      <h1>Rezultat GeoRo <span class="accent">✓</span></h1>
      <p>Îți place de GeoRo? Distribuie scorul și invită prietenii la provocare.</p>

      <div class="share-highlights">
        <div class="highlight-item">
          <div class="highlight-value">4,231</div>
          <div class="highlight-label">PUNCTE</div>
        </div>
        <div class="highlight-item">
          <div class="highlight-value">🔥</div>
          <div class="highlight-label">STREAK</div>
        </div>
        <div class="highlight-item">
          <div class="highlight-value">🗺️</div>
          <div class="highlight-label">ZIUA</div>
        </div>
      </div>

      <div class="share-actions">
        <a href="/" class="btn btn-primary">JOC din nou</a>
        <a href="https://games.ro" target="_blank" class="btn">GAMES.ro</a>
      </div>

      <div class="share-footer">
        Un proiect de <a href="https://buhnici.ro" target="_blank">George Buhnici</a>
      </div>
    </div>
  </div>
</body>
</html>
