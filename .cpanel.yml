---
deployment:
  tasks:
    # Un repo, două conturi pe același server. Ramificare după utilizator:
    # - gamesro: site-ul complet games.ro + /ads/
    # - comedia: DOAR /ads/ (serverul central de reclame; site-ul comedia nu se atinge)
    - if [ "`whoami`" = "gamesro" ]; then /bin/cp -R site/. /home/gamesro/public_html/; fi
    - /bin/mkdir -p $HOME/public_html/ads
    - /bin/cp -R site/ads/. $HOME/public_html/ads/
